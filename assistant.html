<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090914;
  color: #f4f1ff;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  background: #151326;
  border-bottom: 1px solid #30264b;
  text-align: center;
}

header h1 {
  color: #a98aff;
  margin: 0;
  font-size: 28px;
}

header p {
  color: #aaa2bd;
  margin-bottom: 0;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 18px;
}

.status {
  color: #9b8bbd;
  font-size: 13px;
  margin: 10px 0 18px;
  text-align: center;
}

.chat {
  height: 55vh;
  min-height: 320px;
  overflow-y: auto;
  padding: 15px;
  background: #11101e;
  border: 1px solid #30264b;
  border-radius: 20px;
}

.message {
  padding: 14px 17px;
  margin: 12px 0;
  border-radius: 16px;
  max-width: 88%;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #392552;
  margin-left: auto;
}

.bot {
  background: #201b32;
  margin-right: auto;
}

.sender {
  font-size: 12px;
  color: #bba6ff;
  margin-bottom: 6px;
}

textarea {
  width: 100%;
  margin-top: 16px;
  padding: 17px;
  background: #171526;
  color: white;
  border: 1px solid #40345d;
  border-radius: 14px;
  font-size: 16px;
  resize: vertical;
  min-height: 85px;
}

button {
  padding: 15px;
  border: none;
  border-radius: 13px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
}

.send {
  width: 100%;
  margin-top: 12px;
  background: #8155ce;
  color: white;
}

.send:disabled {
  opacity: 0.5;
  cursor: wait;
}

.clear {
  display: block;
  margin: 12px auto;
  background: #28233a;
  color: #d5c7f5;
}

footer {
  text-align: center;
  padding: 25px 10px;
  color: #817994;
  font-size: 13px;
}

button:active {
  opacity: 0.75;
}
</style>
</head>

<body>

<header>
  <h1>NOVA AI</h1>
  <p>Intelligence. Creativity. Possibility.</p>
</header>

<div class="container">

  <div class="status">
    ● NOVA Assistant | AI-powered multilingual assistant
  </div>

  <div class="chat" id="chat"></div>

  <textarea
    id="userInput"
    placeholder="Ask NOVA anything... / NOVA-কে কিছু জিজ্ঞাসা করো"
  ></textarea>

  <button class="send" id="sendButton" onclick="sendMessage()">
    Send Message ↑
  </button>

  <button class="clear" onclick="clearChat()">
    Clear Conversation
  </button>

</div>

<footer>
  NOVA AI · Intelligence. Creativity. Possibility.
  <br><br>
  Powered by OpenAI
</footer>

<script>

// NOVA AI BACKEND CONNECTION

const API_URL =
"https://nova-ai-brain.fayezuddinrahaman2009.workers.dev/chat";

const STORAGE_KEY = "nova_chat_history_v2";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");

let history = [];
let isSending = false;


// DISPLAY MESSAGES

function addMessage(sender, message) {

  const box = document.createElement("div");
  box.className = "message " + sender;

  const label = document.createElement("div");
  label.className = "sender";

  label.textContent = sender === "user" ? "YOU" : "NOVA";

  const content = document.createElement("div");
  content.textContent = message;

  box.appendChild(label);
  box.appendChild(content);

  chat.appendChild(box);

  chat.scrollTop = chat.scrollHeight;

  return box;
}


// SAVE CONVERSATION

function saveHistory() {

  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history)
    );
  } catch (error) {
    console.log("Could not save conversation.");
  }
}


// SEND MESSAGE TO OPENAI THROUGH CLOUDFLARE

async function sendMessage() {

  const message = input.value.trim();

  if (!message || isSending) return;

  isSending = true;

  input.value = "";
  sendButton.disabled = true;
  sendButton.textContent = "NOVA is thinking...";

  addMessage("user", message);

  const thinking = addMessage("bot", "NOVA is thinking...");

  const previousHistory = history.slice(-10);

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        message: message,

        history: previousHistory

      })

    });

    const data = await response.json();

    thinking.remove();

    if (!response.ok || !data.success) {

      throw new Error(
        data.error || "AI service unavailable."
      );

    }

    const reply = data.reply;

    addMessage("bot", reply);

    history.push(
      { role: "user", content: message },
      { role: "assistant", content: reply }
    );

    history = history.slice(-20);

    saveHistory();

  } catch (error) {

    thinking.remove();

    addMessage(
      "bot",
      "Sorry! NOVA could not connect to its AI brain.\n\n" +
      "Error: " + error.message +
      "\n\nPlease try again."
    );

    console.error("NOVA error:", error);

  } finally {

    isSending = false;

    sendButton.disabled = false;
    sendButton.textContent = "Send Message ↑";

    input.focus();

  }

}


// CLEAR CONVERSATION

function clearChat() {

  history = [];

  try {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem("nova_chat_history");
  } catch (error) {
    console.log("Could not clear history.");
  }

  chat.innerHTML = "";

  welcomeMessage();

}


// WELCOME MESSAGE

function welcomeMessage() {

  addMessage(
    "bot",
    "Hello! I am NOVA AI.\n\n" +
    "নমস্কার! আমি NOVA AI।\n\n" +
    "How can I help you today? / " +
    "আমি কীভাবে সাহায্য করতে পারি?"
  );

}


// LOAD PREVIOUS CONVERSATION

function loadHistory() {

  try {

    let saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {

      history = JSON.parse(saved);

    } else {

      // Migrate older prototype conversations.

      const oldSaved =
        localStorage.getItem("nova_chat_history");

      if (oldSaved) {

        const oldHistory = JSON.parse(oldSaved);

        history = [];

        oldHistory.forEach(item => {

          if (item.user) {
            history.push({
              role: "user",
              content: item.user
            });
          }

          if (item.assistant) {
            history.push({
              role: "assistant",
              content: item.assistant
            });
          }

        });

        history = history.slice(-20);

      }

    }

    history = history.filter(item =>
      item &&
      ["user", "assistant"].includes(item.role) &&
      typeof item.content === "string"
    ).slice(-20);

    history.forEach(item => {

      addMessage(
        item.role === "user" ? "user" : "bot",
        item.content
      );

    });

    if (history.length === 0) {
      welcomeMessage();
    }

    saveHistory();

  } catch (error) {

    history = [];
    welcomeMessage();

  }

}


// ENTER TO SEND

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    sendMessage();

  }

});


// START NOVA

loadHistory();

</script>

</body>
</html>
