OCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090914;
  color: #f4f1ff;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  background: #151326;
  border-bottom: 1px solid #30264b;
  text-align: center;
}

header h1 {
  color: #a98aff;
  margin: 0;
  font-size: 28px;
}

header p {
  color: #aaa2bd;
  margin-bottom: 0;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 18px;
}

.status {
  color: #9b8bbd;
  font-size: 13px;
  margin: 10px 0 18px;
  text-align: center;
}

.chat {
  height: 55vh;
  min-height: 320px;
  overflow-y: auto;
  padding: 15px;
  background: #11101e;
  border: 1px solid #30264b;
  border-radius: 20px;
}

.message {
  padding: 14px 17px;
  margin: 12px 0;
  border-radius: 16px;
  max-width: 88%;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #392552;
  margin-left: auto;
}

.bot {
  background: #201b32;
  margin-right: auto;
}

.sender {
  font-size: 12px;
  color: #bba6ff;
  margin-bottom: 6px;
}

textarea {
  width: 100%;
  margin-top: 16px;
  padding: 17px;
  background: #171526;
  color: white;
  border: 1px solid #40345d;
  border-radius: 14px;
  font-size: 16px;
  resize: vertical;
  min-height: 85px;
}

button {
  padding: 15px;
  border: none;
  border-radius: 13px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
}

.send {
  width: 100%;
  margin-top: 12px;
  background: #8155ce;
  color: white;
}

.send:disabled {
  opacity: 0.5;
  cursor: wait;
}

.clear {
  display: block;
  margin: 12px auto;
  background: #28233a;
  color: #d5c7f5;
}

footer {
  text-align: center;
  padding: 25px 10px;
  color: #817994;
  font-size: 13px;
}

button:active {
  opacity: 0.75;
}
</style>
