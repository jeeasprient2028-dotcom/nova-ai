<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090914;
  color: #f4f1ff;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  background: #151326;
  border-bottom: 1px solid #30264b;
  text-align: center;
}

header h1 {
  color: #a98aff;
  margin: 0;
  font-size: 28px;
}

header p {
  color: #aaa2bd;
  margin-bottom: 0;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 18px;
}

.status {
  color: #9b8bbd;
  font-size: 13px;
  margin: 10px 0 18px;
  text-align: center;
}

.chat {
  height: 55vh;
  min-height: 320px;
  overflow-y: auto;
  padding: 15px;
  background: #11101e;
  border: 1px solid #30264b;
  border-radius: 20px;
}

.message {
  padding: 14px 17px;
  margin: 12px 0;
  border-radius: 16px;
  max-width: 88%;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #392552;
  margin-left: auto;
}

.bot {
  background: #201b32;
  margin-right: auto;
}

.sender {
  font-size: 12px;
  color: #bba6ff;
  margin-bottom: 6px;
}

textarea {
  width: 100%;
  margin-top: 16px;
  padding: 17px;
  background: #171526;
  color: white;
  border: 1px solid #40345d;
  border-radius: 14px;
  font-size: 16px;
  resize: vertical;
  min-height: 85px;
}

button {
  padding: 15px;
  border: none;
  border-radius: 13px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
}

.send {
  width: 100%;
  margin-top: 12px;
  background: #8155ce;
  color: white;
}

.clear {
  display: block;
  margin: 12px auto;
  background: #28233a;
  color: #d5c7f5;
}

footer {
  text-align: center;
  padding: 25px 10px;
  color: #817994;
  font-size: 13px;
}

button:active {
  opacity: 0.75;
}
</style>
</head>

<body>

<header>
  <h1>NOVA AI</h1>
  <p>Intelligence. Creativity. Possibility.</p>
</header>

<div class="container">

  <div class="status">
    ● NOVA Assistant | Multilingual Prototype
  </div>

  <div class="chat" id="chat"></div>

  <textarea
    id="userInput"
    placeholder="Ask NOVA anything... / NOVA-কে কিছু জিজ্ঞাসা করো"
  ></textarea>

  <button class="send" onclick="sendMessage()">
    Send Message ↑
  </button>

  <button class="clear" onclick="clearChat()">
    Clear Conversation
  </button>

</div>

<footer>
  NOVA AI · Intelligence. Creativity. Possibility.
  <br><br>
  Experimental prototype. AI model integration coming later.
</footer>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");

let history = [];

function detectLanguage(text) {
  if (/[\u0980-\u09FF]/.test(text)) {
    return "bn";
  }

  if (/[\u0900-\u097F]/.test(text)) {
    return "hi";
  }

  return "en";
}

function addMessage(sender, message) {
  const box = document.createElement("div");
  box.className = "message " + sender;

  const label = document.createElement("div");
  label.className = "sender";
  label.textContent = sender === "user" ? "YOU" : "NOVA";

  const content = document.createElement("div");
  content.textContent = message;

  box.appendChild(label);
  box.appendChild(content);

  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
}

function getResponse(message) {

  const language = detectLanguage(message);
  const text = message.toLowerCase().trim();

  // Bengali responses
  if (language === "bn") {

    if (/হ্যালো|হাই|নমস্কার|আসসালামু/.test(text)) {
      return "নমস্কার! আমি NOVA, তোমার multilingual AI assistant prototype। আজ কীভাবে সাহায্য করতে পারি?";
    }

    if (/তোমার নাম|কে তুমি/.test(text)) {
      return "আমি NOVA AI। আমি একটি multilingual AI assistant prototype।";
    }

    if (/কেমন আছো|কেমন আছেন/.test(text)) {
      return "আমি সাহায্য করার জন্য প্রস্তুত! তুমি কেমন আছো?";
    }

    if (/ধন্যবাদ/.test(text)) {
      return "তোমাকে স্বাগতম! NOVA সবসময় সাহায্য করতে প্রস্তুত।";
    }

    return "তোমার বার্তাটি পেয়েছি। আমি NOVA-এর experimental prototype। প্রকৃত AI model এখনো সংযুক্ত হয়নি। ভবিষ্যতে আমি আরও উন্নত উত্তর দিতে পারব।";
  }

  // Hindi responses
  if (language === "hi") {

    if (/नमस्ते|हेलो|हाय/.test(text)) {
      return "नमस्ते! मैं NOVA हूं। आज मैं आपकी कैसे मदद कर सकता हूं?";
    }

    return "आपका संदेश मिल गया। मैं NOVA का multilingual prototype हूं। वास्तविक AI model अभी कनेक्ट नहीं है।";
  }

  // English responses
  if (/hello|^hi$|hey|good morning|good evening/.test(text)) {
    return "Hello! I am NOVA, your multilingual AI assistant prototype. How can I help you today?";
  }

  if (/your name|who are you/.test(text)) {
    return "I am NOVA AI, an experimental multilingual assistant designed to help with information, creativity and productivity.";
  }

  if (/how are you/.test(text)) {
    return "I am ready to assist you! What would you like to explore today?";
  }

  if (/thank you|thanks/.test(text)) {
    return "You're welcome! Let me know what you would like to explore next.";
  }

  if (/what can you do|help/.test(text)) {
    return "I am designed for:\n\n1. General assistance\n2. Learning and education\n3. Creative ideas\n4. Productivity\n5. Multilingual communication\n\nReal AI integration is still under development.";
  }

  return "I received your message. I am currently running as an experimental prototype. A real AI model has not been connected yet.";
}

function sendMessage() {

  const message = input.value.trim();

  if (!message) return;

  addMessage("user", message);

  const response = getResponse(message);

  addMessage("bot", response);

  history.push({
    user: message,
    assistant: response,
    time: new Date().toISOString()
  });

  try {
    localStorage.setItem(
      "nova_chat_history",
      JSON.stringify(history)
    );
  } catch (error) {
    console.log("History could not be saved.");
  }

  input.value = "";
  input.focus();
}

function clearChat() {

  history = [];

  try {
    localStorage.removeItem("nova_chat_history");
  } catch (error) {
    console.log("Could not clear saved history.");
  }

  chat.innerHTML = "";

  welcomeMessage();
}

function welcomeMessage() {
  addMessage(
    "bot",
    "Hello! I am NOVA. তোমাকে স্বাগতম! আমি কীভাবে সাহায্য করতে পারি?\n\nPrototype assistant."
  );
}

function loadHistory() {

  try {
    const saved = localStorage.getItem("nova_chat_history");

    if (saved) {
      history = JSON.parse(saved);

      history.forEach(item => {
        addMessage("user", item.user);
        addMessage("bot", item.assistant);
      });

      return;
    }
  } catch (error) {
    history = [];
  }

  welcomeMessage();
}

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }

});

loadHistory();

</script>

</body>
</html>
